<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d2a24;--mut:#6b7468;--line:#ddd6c6;--acc:#1f5c4a;--acc2:#e8f0ea;--warn:#b4531a;--hl:#fff3d6;
--serif:'Fraunces',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191a;--card:#1b2224;--ink:#e8e6dd;--mut:#9aa496;--line:#2f3a3b;--acc:#6fc2a2;--acc2:#1f3a33;--warn:#e89a5c;--hl:#3a3320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191a;--card:#1b2224;--ink:#e8e6dd;--mut:#9aa496;--line:#2f3a3b;--acc:#6fc2a2;--acc2:#1f3a33;--warn:#e89a5c;--hl:#3a3320;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
h1{font:600 28px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;margin-top:4px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sl{position:relative}
.sl>label{display:block;font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:4px}
.sb{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.sb span.v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb.on{border-color:var(--acc);background:var(--acc2)}
.sb small{color:var(--mut);font-family:var(--mono);font-size:11px}
.dd{display:none;position:absolute;z-index:30;left:0;right:0;min-width:240px;margin-top:4px;background:var(--card);border:1px solid var(--ink);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:340px;flex-direction:column}
.sl.open .dd{display:flex}
.dd input[type=search]{margin:8px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.dd .act{display:flex;gap:6px;padding:0 8px 6px}.dd .act button{padding:3px 8px;font-size:12px}
.opts{overflow:auto;padding:0 4px 6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:4px;cursor:pointer}
.opt:hover{background:var(--acc2)}.opt input{margin-top:3px;accent-color:var(--acc)}
.note{padding:6px 10px;color:var(--mut);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:18px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:stretch}
.k{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.k .l{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.k .n{font:600 26px/1.2 var(--serif);margin-top:4px;word-break:break-all}
.k.f{background:var(--acc);border-color:var(--acc)}.k.f .l,.k.f .n{color:#fff}
:root[data-theme="dark"] .k.f .l,:root[data-theme="dark"] .k.f .n{color:#10201a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k.f .l,:root:not([data-theme="light"]) .k.f .n{color:#10201a}}
.k .s{font-size:12px;color:var(--mut);margin-top:2px}.k.f .s{color:inherit;opacity:.85}
.inp{display:flex;align-items:center;gap:6px}
.inp input{width:100%;font:600 24px var(--serif);padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.inp b{font:600 22px var(--serif)}
.tw{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:920px}
th{position:sticky;top:0;background:var(--ink);color:var(--bg);font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;text-align:left;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
body.drag .wrap{outline:3px dashed var(--acc);outline-offset:-6px}
.st{font-size:12.5px;color:var(--mut);margin:-6px 0 14px}.st.err{color:var(--warn);font-weight:500}
tr.tot td{background:var(--hl);font-weight:600;border-top:1px solid var(--ink)}
tfoot tr:first-child td{border-top:2px solid var(--ink)}
tfoot tr:last-child td{background:var(--acc);color:#fff;font-size:15px}
:root[data-theme="dark"] tfoot tr:last-child td{color:#10201a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tfoot tr:last-child td{color:#10201a}}
tbody tr:hover td{background:var(--acc2)}
.pg{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;color:var(--mut);font-size:12.5px}
.chk{margin-top:10px;font-size:12.5px;color:var(--mut)}.chk b{color:var(--acc)}
h2{font:600 18px var(--serif);margin:0 0 4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style></head><body><div class="wrap">

   if(!tot)opts.innerHTML='<div class="note">No options</div>';
   if(tot>300)opts.insertAdjacentHTML('beforeend',`<div class="note">Showing 300 of ${tot} — type to narrow</div>`);
   d._list=list.map(x=>x[0]);
  };
  fill();
  inp.oninput=()=>{search[k]=inp.value;fill()};
  inp.onclick=e=>e.stopPropagation();d.querySelector('.dd').onclick=e=>e.stopPropagation();
  d.querySelector('[data-a=all]').onclick=()=>{d._list.forEach(v=>s.add(v));prune();update(true)};
  d.querySelector('[data-a=clr]').onclick=()=>{s.clear();update(true)};
  g.appendChild(d);
 });
}
function update(rebuild){
 page=rebuild===true?0:page;
 if(rebuild===true)buildSlicers();
 const vis=visible();
 let A=0,G=0,T=0;const rows=[];
 vis.forEach(si=>bySch[si].forEach(r=>{A+=r[2];G+=r[3];T+=r[4];rows.push(r)}));
 let p=parseFloat(document.getElementById('pct').value);if(isNaN(p)||p<0)p=0;if(p>100)p=100;
 const disc=T*p/100,after=T-disc;
 if(vis.length!==1){
  const E=id=>document.getElementById(id);
  E('tf').textContent='–';E('tc').textContent='–';E('tcs').textContent='';
  const m=vis.length===0?'No scheme matches the selected filters.':vis.length.toLocaleString('en-IN')+' schemes match your filters. Narrow the filters down to a single scheme to see the fees.';
  E('tfs').textContent=m;
  E('tb').innerHTML='<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--mut)">'+m+'</td></tr>';
  E('tf2').innerHTML='';E('cnt').textContent='';E('pn').textContent='';E('pv').disabled=true;E('nx').disabled=true;E('chk').innerHTML='';
  window._rows=[];window._p=p;return;
 }
 document.getElementById('tf').textContent=fmt(T);
 document.getElementById('tfs').textContent=vis.length.toLocaleString('en-IN')+' scheme'+(vis.length===1?'':'s')+' in view';
 document.getElementById('tc').textContent=fmt(after);
 document.getElementById('tcs').textContent='Concession '+fmt(disc)+' ('+p+'%)';
 rows.sort((a,b)=>S[a[0]][7].localeCompare(S[b[0]][7])||D.heads[a[1]].localeCompare(D.heads[b[1]]));
 const pages=Math.max(1,Math.ceil(rows.length/PS));if(page>=pages)page=pages-1;
 const sl=rows.slice(page*PS,page*PS+PS);
 const tb=document.getElementById('tb');
 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
 tb.innerHTML=sl.map(r=>{const d=r[4]*p/100;return `<tr><td>${esc(S[r[0]][7])}</td><td>${esc(D.dv.center[S[r[0]][2]])}</td><td>${esc(D.heads[r[1]])}</td><td class="n">${num(r[2])}</td><td class="n">${num(r[3])}</td><td class="n">${num(r[4])}</td><td class="n">${num(d)}</td><td class="n">${num(r[4]-d)}</td></tr>`}).join('')
 ;
 document.getElementById('tf2').innerHTML=`<tr class="tot"><td colspan="3">Total (all ${rows.length.toLocaleString('en-IN')} rows)</td><td class="n">${num(A)}</td><td class="n">${num(G)}</td><td class="n">${num(T)}</td><td class="n">${num(disc)}</td><td class="n">${num(after)}</td></tr><tr class="tot"><td colspan="7" style="text-align:right">Total fee with GST</td><td class="n">${fmt(T)}</td></tr><tr class="tot"><td colspan="7" style="text-align:right">Less: concession @ ${p}%</td><td class="n">− ${fmt(disc)}</td></tr><tr class="tot"><td colspan="7" style="text-align:right">Total fee after concession (with GST)</td><td class="n">${fmt(after)}</td></tr>`;
 document.getElementById('cnt').textContent=rows.length?`Rows ${page*PS+1}–${Math.min(rows.length,page*PS+PS)} of ${rows.length.toLocaleString('en-IN')}`:'No rows for this selection';
 document.getElementById('pn').textContent=`${page+1} / ${pages}`;
 document.getElementById('pv').disabled=page===0;document.getElementById('nx').disabled=page>=pages-1;
 const ok=Math.abs(after-(T-T*p/100))<0.005;
 document.getElementById('chk').innerHTML=`Check: sum of “Fees after discount” = <b>${fmt(after)}</b> ${ok?'✓ matches':'✗ differs from'} Total fee after concession.`;
 window._rows=rows;window._p=p;
}
document.addEventListener('click',()=>{if(open){open=null;buildSlicers()}});
document.getElementById('pct').oninput=()=>update();
document.getElementById('pv').onclick=()=>{page--;update()};document.getElementById('nx').onclick=()=>{page++;update()};
document.getElementById('reset').onclick=()=>{KEYS.forEach(k=>sel[k].clear());search={};document.getElementById('pct').value=0;update(true)};
function init(nd){D=nd;S=D.schemes;bySch=S.map(()=>[]);D.rows.forEach(r=>bySch[r[0]].push(r));KEYS.forEach(k=>sel[k].clear());search={};open=null;page=0;
 document.getElementById('meta').textContent=S.length.toLocaleString('en-IN')+' schemes · '+D.rows.length.toLocaleString('en-IN')+' fee rows · '+(D.src||'built-in data as of 6 Nov 2026');update(true)}
init(D);
</script></body></html>
